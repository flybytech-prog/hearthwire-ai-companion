[project]
name = "hearthwire"
version = "1.0.0"
description = "Hearthwire: an AI companion for KDE Plasma 6 with subscription usage meters and chats with AI sites"
requires-python = ">=3.11"
# PySide6 is provided by the system package (pacman), intentionally NOT a pip dep.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/flybytech-prog/hearthwire-ai-companion"
Issues = "https://github.com/flybytech-prog/hearthwire-ai-companion/issues"

[project.scripts]
hearthwire = "hearthwire.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
include = ["hearthwire*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
