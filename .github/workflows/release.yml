name: Release packages

# A pushed v* tag builds, lints and install-tests the Arch, Fedora and Ubuntu
# packages, then attaches them with SHA256SUMS and build provenance to a
# draft GitHub Release for the tag. The draft is visible only to people with
# write access, on the repository's Releases page; the maintainer reviews and
# publishes it by hand. Run by hand (workflow_dispatch) it is a dry run: every
# job but "publish" runs, the verify job included, and the files are kept as
# workflow artifacts.
#
# Trust flow:
# - "source" checks out the commit and makes the source tarball with
#   `git archive` (packaging/source-archive.sh) before any third-party code
#   runs, and does nothing else. Its sha256 is a job output, which no other
#   job can change.
# - "tests" runs the suite on a pinned Python with hash-pinned dependencies.
#   It uploads nothing and has no outputs, so it cannot feed the tarball or a
#   package.
# - Every job that downloads an artifact asks for it by its exact name and
#   checks it against the sha256 output of the job that made it.
# - "verify" (read-only, also on a dry run) checks out the commit again,
#   rebuilds the tarball and compares the bytes, and checks every package.
# - "publish" runs only for a tag push and is the only job with write
#   permissions: it checks the files once more, refuses when a release or
#   draft for the tag exists, attests, then creates the draft.
# - A tag push is refused unless the tag is exactly "v" + pyproject.toml's
#   X.Y.Z and its commit is on main.
#
# Runner and container images are pinned (ubuntu-24.04; containers by
# digest, see README "For maintainers" to refresh them), so the source and
# verify jobs use the same git and gzip and the rebuilt tarball matches.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

# bash -eo pipefail: a failing command on the left of a pipe fails the step.
defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Make the source tarball
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.tarball.outputs.sha256 }}
    steps:
      - name: Check out the commit with the history of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version, the tag and the release notes
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # check-version.py prints the version only when it is exactly X.Y.Z
          # and, for a tag push, the tag is exactly "v" + that version.
          if [ "$EVENT_NAME" = push ]; then
            [ "$REF_TYPE" = tag ] || { echo "::error::Only a tag push makes a release"; exit 1; }
            version=$(python3 -I packaging/check-version.py --tag "$REF_NAME" < pyproject.toml)
          else
            version=$(python3 -I packaging/check-version.py < pyproject.toml)
          fi
          case "$version" in
            *[!0-9.]* | "") echo "::error::Unexpected version"; exit 1 ;;
          esac
          # Fail now, not after the builds, when the draft would have no notes.
          [ -f "packaging/RELEASE_NOTES-$version.md" ] || { echo "::error::packaging/RELEASE_NOTES-$version.md is missing"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check that the tagged commit is on main
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            git rev-parse --verify --quiet refs/remotes/origin/main > /dev/null \
              || { echo "::error::origin/main was not fetched"; exit 1; }
            commit=$(git rev-parse --verify "$GITHUB_SHA^{commit}")
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main \
              || { echo "::error::The tagged commit is not on main"; exit 1; }
          fi

      - name: Make the source tarball
        id: tarball
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive=$(packaging/source-archive.sh "$GITHUB_SHA" "$RUNNER_TEMP/source")
          [ "$archive" = "$RUNNER_TEMP/source/hearthwire-$VERSION.tar.gz" ] || exit 1
          sha256=$(sha256sum "$archive" | cut -d ' ' -f 1)
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$sha256  hearthwire-$VERSION.tar.gz"

      - name: Keep the source tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source/hearthwire-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Run the test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    # No outputs and no upload: nothing here reaches the tarball or a package.
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14 (the packages' Python)
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          # No cache, and nothing written to PATH or the environment: the
          # step below calls this interpreter by its path.
          update-environment: false

      - name: Run the tests
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          "$PYTHON" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; sys.exit(sys.version_info[:2] != (3, 14))'
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --require-hashes --only-binary=:all: \
            -r .github/requirements-test.txt
          QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/venv/bin/python" -m pytest

  # --- Arch Linux, CachyOS, Manjaro -------------------------------------------------------------

  arch-build:
    name: Build the Arch package
    needs: [source, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: archlinux@sha256:fa2d4ce3310ddd90a4208e5168be8ad367da5129af1245f38fd2d803bcbe3239 # archlinux:base-devel
    outputs:
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Check the source tarball
        run: |
          case "$SOURCE_SHA256" in *[!0-9a-f]* | "") exit 1 ;; esac
          [ "${#SOURCE_SHA256}" -eq 64 ] || exit 1
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -

      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed python python-build python-installer python-setuptools python-wheel namcap

      - name: Build
        run: |
          useradd --create-home builder
          install -d -o builder /build
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          install -m 0644 -o builder "/tmp/source/hearthwire-$VERSION/packaging/arch/PKGBUILD" /build/PKGBUILD
          install -m 0644 -o builder "/tmp/source/hearthwire-$VERSION.tar.gz" /build/
          # makepkg refuses to run as root. --nodeps: the build tools are
          # installed above; the runtime dependencies are checked by the
          # install test in a fresh container.
          su builder -c 'cd /build && PACKAGER="flybytech-prog <104578369+flybytech-prog@users.noreply.github.com>" makepkg --nodeps --noconfirm'

      - name: Lint the PKGBUILD (namcap)
        run: |
          namcap /build/PKGBUILD | tee /tmp/namcap.txt
          if grep -q ' E: ' /tmp/namcap.txt; then exit 1; fi

      - name: Record the package and its sha256
        id: package
        run: |
          set -- /build/hearthwire-"$VERSION"-*-any.pkg.tar.zst
          [ "$#" -eq 1 ] || exit 1
          [ -f "$1" ] || exit 1
          echo "file=$(basename "$1")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-arch
          path: /build/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  arch-test:
    name: Install-test the Arch package
    needs: [source, arch-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: archlinux@sha256:d4594bb2300cba11f41c2f27923eb56f63d9988909c402f9c95517d1e362c899 # archlinux:latest
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      PACKAGE_FILE: ${{ needs.arch-build.outputs.file }}
      PACKAGE_SHA256: ${{ needs.arch-build.outputs.sha256 }}
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-arch
          path: /tmp/package

      - name: Check the downloads against the build outputs
        run: |
          for value in "$SOURCE_SHA256" "$PACKAGE_SHA256"; do
            case "$value" in *[!0-9a-f]* | "") exit 1 ;; esac
            [ "${#value}" -eq 64 ] || exit 1
          done
          case "$PACKAGE_FILE" in */* | *[!A-Za-z0-9._+~-]* | "") exit 1 ;; esac
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          [ "$(ls -A /tmp/package)" = "$PACKAGE_FILE" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -
          printf '%s  %s\n' "$PACKAGE_SHA256" "/tmp/package/$PACKAGE_FILE" | sha256sum --check --strict -

      - name: Install the package
        run: |
          pacman -Syu --noconfirm
          pacman -U --noconfirm "/tmp/package/$PACKAGE_FILE"

      - name: Check what landed
        run: |
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

      - name: Check again with the optional dependencies
        run: |
          pacman -S --noconfirm --needed --asdeps qt6-webengine gocryptfs fuse3 kdialog kwallet qt6-tools openssl libsecret
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

      - name: Lint the package (namcap)
        run: |
          pacman -S --noconfirm --needed namcap
          namcap "/tmp/package/$PACKAGE_FILE" | tee /tmp/namcap.txt
          if grep -q ' E: ' /tmp/namcap.txt; then exit 1; fi

  # --- Fedora KDE ---------------------------------------------------------------------------------

  fedora-build:
    name: Build the Fedora package
    needs: [source, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e # fedora:44
    outputs:
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Check the source tarball
        run: |
          case "$SOURCE_SHA256" in *[!0-9a-f]* | "") exit 1 ;; esac
          [ "${#SOURCE_SHA256}" -eq 64 ] || exit 1
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -

      - name: Install the build tools
        run: dnf -y install rpm-build rpmlint python3-devel pyproject-rpm-macros python3-pip python3-setuptools tar findutils

      - name: Build
        run: |
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          spec="/tmp/source/hearthwire-$VERSION/packaging/fedora/hearthwire.spec"
          rpmlint "$spec"
          mkdir -p /build/SOURCES
          cp "/tmp/source/hearthwire-$VERSION.tar.gz" /build/SOURCES/
          rpmbuild -ba --define "_topdir /build" "$spec"

      - name: Lint the package (rpmlint)
        run: rpmlint /build/RPMS/noarch/hearthwire-*.noarch.rpm

      - name: Record the package and its sha256
        id: package
        run: |
          set -- /build/RPMS/noarch/hearthwire-"$VERSION"-*.noarch.rpm
          [ "$#" -eq 1 ] || exit 1
          [ -f "$1" ] || exit 1
          echo "file=$(basename "$1")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-fedora
          path: /build/RPMS/noarch/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  fedora-test:
    name: Install-test the Fedora package on Fedora 44
    needs: [source, fedora-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: fedora@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e # fedora:44
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      PACKAGE_FILE: ${{ needs.fedora-build.outputs.file }}
      PACKAGE_SHA256: ${{ needs.fedora-build.outputs.sha256 }}
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-fedora
          path: /tmp/package

      - name: Check the downloads against the build outputs
        run: |
          for value in "$SOURCE_SHA256" "$PACKAGE_SHA256"; do
            case "$value" in *[!0-9a-f]* | "") exit 1 ;; esac
            [ "${#value}" -eq 64 ] || exit 1
          done
          case "$PACKAGE_FILE" in */* | *[!A-Za-z0-9._+~-]* | "") exit 1 ;; esac
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          [ "$(ls -A /tmp/package)" = "$PACKAGE_FILE" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -
          printf '%s  %s\n' "$PACKAGE_SHA256" "/tmp/package/$PACKAGE_FILE" | sha256sum --check --strict -

      - name: Install the package
        run: |
          dnf -y install "/tmp/package/$PACKAGE_FILE"
          # For unpacking the check script; the container image may not have them.
          dnf -y install tar findutils

      - name: Check what landed
        run: |
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

      - name: Check again with the optional dependencies
        run: |
          dnf -y install gocryptfs fuse3 kdialog kf6-kwallet qt6-qttools openssl libsecret
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

  fedora-43-test:
    name: Install-test the Fedora package on Fedora 43
    needs: [source, fedora-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    # The same Fedora 44-built RPM: the release notes promise Fedora 43 too.
    container: fedora@sha256:f01112b9a1f1d0504ad962d9adfa401425033f8ab067e0a821904ebdde5b8ca5 # fedora:43
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      PACKAGE_FILE: ${{ needs.fedora-build.outputs.file }}
      PACKAGE_SHA256: ${{ needs.fedora-build.outputs.sha256 }}
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-fedora
          path: /tmp/package

      - name: Check the downloads against the build outputs
        run: |
          for value in "$SOURCE_SHA256" "$PACKAGE_SHA256"; do
            case "$value" in *[!0-9a-f]* | "") exit 1 ;; esac
            [ "${#value}" -eq 64 ] || exit 1
          done
          case "$PACKAGE_FILE" in */* | *[!A-Za-z0-9._+~-]* | "") exit 1 ;; esac
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          [ "$(ls -A /tmp/package)" = "$PACKAGE_FILE" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -
          printf '%s  %s\n' "$PACKAGE_SHA256" "/tmp/package/$PACKAGE_FILE" | sha256sum --check --strict -

      - name: Install the package
        run: |
          dnf -y install "/tmp/package/$PACKAGE_FILE"
          # For unpacking the check script; the container image may not have them.
          dnf -y install tar findutils

      - name: Check what landed
        run: |
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

      - name: Check again with the optional dependencies
        run: |
          dnf -y install gocryptfs fuse3 kdialog kf6-kwallet qt6-qttools openssl libsecret
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

  # --- Ubuntu 26.04 LTS (Kubuntu) -----------------------------------------------------------------

  ubuntu-build:
    name: Build the Ubuntu package
    needs: [source, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # ubuntu:26.04
    outputs:
      file: ${{ steps.package.outputs.file }}
      sha256: ${{ steps.package.outputs.sha256 }}
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Check the source tarball
        run: |
          case "$SOURCE_SHA256" in *[!0-9a-f]* | "") exit 1 ;; esac
          [ "${#SOURCE_SHA256}" -eq 64 ] || exit 1
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -

      - name: Install the build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential debhelper dh-python \
            pybuild-plugin-pyproject python3-all python3-setuptools lintian

      - name: Build
        run: |
          mkdir -p /build
          cp "/tmp/source/hearthwire-$VERSION.tar.gz" "/build/hearthwire_$VERSION.orig.tar.gz"
          tar -xzf "/build/hearthwire_$VERSION.orig.tar.gz" -C /build
          cp -r "/build/hearthwire-$VERSION/packaging/debian" "/build/hearthwire-$VERSION/debian"
          cd "/build/hearthwire-$VERSION"
          dpkg-buildpackage -us -uc -b

      - name: Lint the package (lintian)
        run: lintian --fail-on error --display-info /build/hearthwire_*_all.deb

      - name: Record the package and its sha256
        id: package
        run: |
          set -- /build/hearthwire_"$VERSION"-*_all.deb
          [ "$#" -eq 1 ] || exit 1
          [ -f "$1" ] || exit 1
          echo "file=$(basename "$1")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$1" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Keep the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-ubuntu
          path: /build/${{ steps.package.outputs.file }}
          if-no-files-found: error
          retention-days: 7

  ubuntu-test:
    name: Install-test the Ubuntu package
    needs: [source, ubuntu-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Artifacts of this run need no token permission.
    permissions: {}
    container: ubuntu@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c # ubuntu:26.04
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      PACKAGE_FILE: ${{ needs.ubuntu-build.outputs.file }}
      PACKAGE_SHA256: ${{ needs.ubuntu-build.outputs.sha256 }}
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: /tmp/source

      - name: Get the package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-ubuntu
          path: /tmp/package

      - name: Check the downloads against the build outputs
        run: |
          for value in "$SOURCE_SHA256" "$PACKAGE_SHA256"; do
            case "$value" in *[!0-9a-f]* | "") exit 1 ;; esac
            [ "${#value}" -eq 64 ] || exit 1
          done
          case "$PACKAGE_FILE" in */* | *[!A-Za-z0-9._+~-]* | "") exit 1 ;; esac
          [ "$(ls -A /tmp/source)" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          [ "$(ls -A /tmp/package)" = "$PACKAGE_FILE" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "/tmp/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -
          printf '%s  %s\n' "$PACKAGE_SHA256" "/tmp/package/$PACKAGE_FILE" | sha256sum --check --strict -

      - name: Install the package
        run: |
          apt-get update
          apt-get install -y "/tmp/package/$PACKAGE_FILE"

      - name: Check what landed
        run: |
          tar -xzf "/tmp/source/hearthwire-$VERSION.tar.gz" -C /tmp/source
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

      - name: Check again with the optional dependencies
        run: |
          apt-get install -y gocryptfs fuse3 kdialog kwallet6 qdbus-qt6 openssl libsecret-tools
          sh "/tmp/source/hearthwire-$VERSION/packaging/check-install.sh" "$VERSION"

  # --- Verify (always, read-only) and publish (tag push only) -----------------------------------

  verify:
    name: Verify the tarball and the packages
    needs: [source, arch-build, fedora-build, ubuntu-build, arch-test, fedora-test, fedora-43-test, ubuntu-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Read-only on every run, a dry run included.
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      ARCH_FILE: ${{ needs.arch-build.outputs.file }}
      ARCH_SHA256: ${{ needs.arch-build.outputs.sha256 }}
      FEDORA_FILE: ${{ needs.fedora-build.outputs.file }}
      FEDORA_SHA256: ${{ needs.fedora-build.outputs.sha256 }}
      UBUNTU_FILE: ${{ needs.ubuntu-build.outputs.file }}
      UBUNTU_SHA256: ${{ needs.ubuntu-build.outputs.sha256 }}
    steps:
      - name: Check out the commit again
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get the source tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source

      - name: Rebuild the source tarball from the commit and compare the bytes
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          # Peeled, so an annotated tag compares as its commit.
          [ "$(git rev-parse --verify 'HEAD^{commit}')" = "$(git rev-parse --verify "$GITHUB_SHA^{commit}")" ] || exit 1
          if [ "$EVENT_NAME" = push ]; then
            checked=$(python3 -I packaging/check-version.py --tag "$TAG" < pyproject.toml)
          else
            checked=$(python3 -I packaging/check-version.py < pyproject.toml)
          fi
          [ "$checked" = "$VERSION" ] || exit 1
          case "$SOURCE_SHA256" in *[!0-9a-f]* | "") exit 1 ;; esac
          [ "${#SOURCE_SHA256}" -eq 64 ] || exit 1
          rebuilt=$(packaging/source-archive.sh "$GITHUB_SHA" "$RUNNER_TEMP/rebuilt")
          [ "$(ls -A "$RUNNER_TEMP/source")" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "$rebuilt" | sha256sum --check --strict -
          cmp -- "$rebuilt" "$RUNNER_TEMP/source/hearthwire-$VERSION.tar.gz"

      - name: Get the Arch package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-arch
          path: ${{ runner.temp }}/arch

      - name: Get the Fedora package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-fedora
          path: ${{ runner.temp }}/fedora

      - name: Get the Ubuntu package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-ubuntu
          path: ${{ runner.temp }}/ubuntu

      - name: Check the packages against the build outputs and write SHA256SUMS
        run: |
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          take() { # FOLDER FILE SHA256: exactly that one file, with exactly that sha256
            case "$3" in *[!0-9a-f]* | "") return 1 ;; esac
            [ "${#3}" -eq 64 ] || return 1
            case "$2" in */* | *[!A-Za-z0-9._+~-]* | "") return 1 ;; esac
            [ "$(ls -A "$RUNNER_TEMP/$1")" = "$2" ] || return 1
            printf '%s  %s\n' "$3" "$RUNNER_TEMP/$1/$2" | sha256sum --check --strict - || return 1
            mv -- "$RUNNER_TEMP/$1/$2" "$release/$2"
          }
          take arch "$ARCH_FILE" "$ARCH_SHA256"
          take fedora "$FEDORA_FILE" "$FEDORA_SHA256"
          take ubuntu "$UBUNTU_FILE" "$UBUNTU_SHA256"
          cd "$release"
          sha256sum -- "$ARCH_FILE" "$FEDORA_FILE" "$UBUNTU_FILE" > SHA256SUMS
          cat SHA256SUMS

      - name: Keep the release files (the dry run's result)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create the draft GitHub Release
    needs: [source, arch-build, fedora-build, ubuntu-build, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The only job with write permissions, and it runs only for a tag push.
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.source.outputs.version }}
      SOURCE_SHA256: ${{ needs.source.outputs.sha256 }}
      ARCH_FILE: ${{ needs.arch-build.outputs.file }}
      ARCH_SHA256: ${{ needs.arch-build.outputs.sha256 }}
      FEDORA_FILE: ${{ needs.fedora-build.outputs.file }}
      FEDORA_SHA256: ${{ needs.fedora-build.outputs.sha256 }}
      UBUNTU_FILE: ${{ needs.ubuntu-build.outputs.file }}
      UBUNTU_SHA256: ${{ needs.ubuntu-build.outputs.sha256 }}
    steps:
      - name: Get the source tarball (for the release notes)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source
          path: ${{ runner.temp }}/source

      - name: Get the Arch package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-arch
          path: ${{ runner.temp }}/arch

      - name: Get the Fedora package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-fedora
          path: ${{ runner.temp }}/fedora

      - name: Get the Ubuntu package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-ubuntu
          path: ${{ runner.temp }}/ubuntu

      - name: Check every file against the build outputs and write SHA256SUMS
        run: |
          case "$SOURCE_SHA256" in *[!0-9a-f]* | "") exit 1 ;; esac
          [ "${#SOURCE_SHA256}" -eq 64 ] || exit 1
          [ "$(ls -A "$RUNNER_TEMP/source")" = "hearthwire-$VERSION.tar.gz" ] || exit 1
          printf '%s  %s\n' "$SOURCE_SHA256" "$RUNNER_TEMP/source/hearthwire-$VERSION.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/source/hearthwire-$VERSION.tar.gz" -C "$RUNNER_TEMP/source" \
            "hearthwire-$VERSION/packaging/RELEASE_NOTES-$VERSION.md"
          release="$RUNNER_TEMP/release"
          mkdir -p "$release"
          take() { # FOLDER FILE SHA256: exactly that one file, with exactly that sha256
            case "$3" in *[!0-9a-f]* | "") return 1 ;; esac
            [ "${#3}" -eq 64 ] || return 1
            case "$2" in */* | *[!A-Za-z0-9._+~-]* | "") return 1 ;; esac
            [ "$(ls -A "$RUNNER_TEMP/$1")" = "$2" ] || return 1
            printf '%s  %s\n' "$3" "$RUNNER_TEMP/$1/$2" | sha256sum --check --strict - || return 1
            mv -- "$RUNNER_TEMP/$1/$2" "$release/$2"
          }
          take arch "$ARCH_FILE" "$ARCH_SHA256"
          take fedora "$FEDORA_FILE" "$FEDORA_SHA256"
          take ubuntu "$UBUNTU_FILE" "$UBUNTU_SHA256"
          cd "$release"
          sha256sum -- "$ARCH_FILE" "$FEDORA_FILE" "$UBUNTU_FILE" > SHA256SUMS
          cat SHA256SUMS

      - name: Refuse when a release or draft for the tag exists
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Drafts are listed too (the token can push). A re-run stops here,
          # before it could attest or create a second draft.
          existing=$(gh api --method GET --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq '.[] | select(.tag_name == env.TAG) | .id')
          if [ -n "$existing" ]; then
            echo "::error::A release or draft for $TAG exists already"
            exit 1
          fi

      - name: Attest build provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release/${{ needs.arch-build.outputs.file }}
            ${{ runner.temp }}/release/${{ needs.fedora-build.outputs.file }}
            ${{ runner.temp }}/release/${{ needs.ubuntu-build.outputs.file }}
            ${{ runner.temp }}/release/SHA256SUMS

      - name: Create the draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          notes="$RUNNER_TEMP/source/hearthwire-$VERSION/packaging/RELEASE_NOTES-$VERSION.md"
          [ -f "$notes" ] || exit 1
          cd "$RUNNER_TEMP/release"
          # --draft: nothing is public until the maintainer presses Publish.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Hearthwire $VERSION" --notes-file "$notes" \
            "./$ARCH_FILE" "./$FEDORA_FILE" "./$UBUNTU_FILE" SHA256SUMS
